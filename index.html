<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <!-- display area with small history preview -->
      <div class="display-wrap">
        <div class="history-line" id="historyPreview"></div>
        <input type="text" id="display" readonly placeholder="0" value="0" />
      </div>

      <!-- button grid -->
      <div class="button-grid">
        <button class="btn clear" id="clearAll">AC</button>
        <button class="btn clear" id="backspace">⌫</button>
        <button class="btn operator" id="percent">%</button>
        <button class="btn operator" id="divide">÷</button>

        <button class="btn" id="num7">7</button>
        <button class="btn" id="num8">8</button>
        <button class="btn" id="num9">9</button>
        <button class="btn operator" id="multiply">×</button>

        <button class="btn" id="num4">4</button>
        <button class="btn" id="num5">5</button>
        <button class="btn" id="num6">6</button>
        <button class="btn operator" id="subtract">−</button>

        <button class="btn" id="num1">1</button>
        <button class="btn" id="num2">2</button>
        <button class="btn" id="num3">3</button>
        <button class="btn operator" id="add">+</button>

        <button class="btn zero" id="num0">0</button>
        <button class="btn" id="decimal">.</button>
        <button class="btn equals" id="equals">=</button>
      </div>
    </div>
    <script src="script.JS"></script>
  </body>
</html>
